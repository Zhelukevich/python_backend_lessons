[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
# Enable Pyflakes (F), pycodestyle (E), and isort (I)
select = [
    "E",   # стиль pycodestyle
    "F",   # логика Pyflakes
    "UP",  # обновление синтаксиса pyupgrade
    "ANN", # аннотации типов (именно то, что вы хотели ранее)
    "I",   # сортировка импортов
]
